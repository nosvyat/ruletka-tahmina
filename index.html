<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Рулетка сюрпризов для Тахмины</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/intro.css">
  <link rel="stylesheet" href="css/wheel.css">
  <link rel="stylesheet" href="css/result.css">
</head>
<body>
  <div class="app">

    <section class="screen active" id="introScreen">
      <div class="intro-simple">
        <div class="intro-text" id="introText"></div>

        <button class="open-btn intro-btn hidden" id="openSurprise">
          Крутить рулетку
        </button>
      </div>
    </section>

    <section class="screen" id="wheelScreen">
      <div class="wheel-hero glass-fade">
        <div class="title">Рулетка подарков</div>
        <div class="desc">
          Покрути рулетку и узнай, какой подарок ты можешь отправить Тахмине 💝
        </div>
      </div>

      <div class="wheel-wrap">
        <div class="pointer"></div>
        <canvas id="wheel" width="520" height="520"></canvas>
        <div class="center">🎁</div>
      </div>

      <button class="spin-btn" id="spin">Выбрать подарок</button>

      <div class="wait-box" id="waitBox">
        <div class="wait-title">Подбор подарка</div>
        <div class="wait-text" id="waitText">
          Смотрим, какой подарок можно отправить Тахмине... ✨
        </div>
        <div class="wait-dots">•••</div>
      </div>

      <div class="result-card" id="resultCard">
        <div class="confetti" id="confetti">
          <span class="spark">✨</span>
          <span class="spark">🎉</span>
          <span class="spark">💖</span>
          <span class="spark">🎊</span>
          <span class="spark">✨</span>
          <span class="spark">🎀</span>
          <span class="spark">💫</span>
          <span class="spark">🎉</span>
        </div>

        <div class="result-top" id="resultTop">Для тебя сегодня выпало 💖</div>
        <div class="result-label" id="resultLabel">Милый подарок</div>
        <div class="result-name" id="name">—</div>
        <div class="result-text" id="text">Нажми «Выбрать подарок»</div>
        <div class="result-kind" id="resultKind">Уровень сюрприза</div>

        <div class="share" id="share">
          <button class="share-btn telegram-btn" id="sendBtn">
            <span class="telegram-icon">🎁</span>
            <span>Отправить Тахмине</span>
          </button>
        </div>
      </div>

      <div class="footer-note">Особенные подарки сияют немного ярче ✨</div>
    </section>

  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
